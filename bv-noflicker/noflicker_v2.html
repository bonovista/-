<!-- BV-NOFLICKER v2 (2026-11-20) : 화면전환 깜빡임 차단 + 목록 사진은 다 받은 뒤 떠오르게. v1(2026-09-01)에서 바뀐 곳만 [v2] 표시. 롤백=이 블록을 v1 원문(noflicker_v1_live.html)으로 되돌림 -->
<script>
(function(){var d=document,h=d.documentElement,c=" bv-cloak";
try{if(sessionStorage.getItem("bvSlide")==="1"){sessionStorage.removeItem("bvSlide");c=" bv-slide"+c;}}catch(e){}
h.className+=c+" bv-pcloak";
function un(){h.classList.remove("bv-cloak");}
function unp(){h.classList.remove("bv-pcloak");}
var t2=setInterval(function(){var e=d.getElementById("span_product_price_text");if(e){var s=(e.textContent||"").trim();if(s===""||/[^0-9]/.test(s)){clearInterval(t2);unp();}}else if(d.readyState!=="loading"){clearInterval(t2);unp();}},30);
setTimeout(function(){clearInterval(t2);unp();},2000);
var t=setInterval(function(){if(d.querySelector(".bvp-brand")||d.readyState!=="loading"){clearInterval(t);un();}},30);
setTimeout(function(){clearInterval(t);un();},1500);
/* [v2] 슬라이드는 끝까지 간다. v1 은 1.8초에 bv-slide 를 무조건 뗐다. 머리의 동기 스크립트(bv_gender.js 약 300KB, 10분마다 새 주소)가 늦게 오면
   첫 그리기가 늦어지고, 1.8초에 화면이 아직 올라오는 중이라 남은 거리를 한 프레임에 점프했다(2026-11-20 실측: 87px, 투명도 0.21→1).
   시작했으면 끝(animationend)에서 떼고, 1.8초까지 시작도 못 했으면 그때 뗀다(시작 전에 떼면 점프 없이 그냥 보인다). 4초는 최후 안전판. */
var slOn=0;function sl(){h.classList.remove("bv-slide");}
function slRun(){if(slOn)return true;var e=d.getElementById("contents")||d.getElementById("container");if(!e||!e.getAnimations)return false;return e.getAnimations().some(function(a){return a.animationName==="bvSlideUp"&&a.playState!=="finished";});}
d.addEventListener("animationstart",function(e){if(e.animationName==="bvSlideUp")slOn=1;},true);
d.addEventListener("animationend",function(e){if(e.animationName==="bvSlideUp")sl();},true);
d.addEventListener("animationcancel",function(e){if(e.animationName==="bvSlideUp")sl();},true);
setTimeout(function(){if(!slRun())sl();},1800);setTimeout(sl,4000);
/* [v2] 목록 사진은 다 받은 뒤 0.5초에 걸쳐 떠오른다. v1 까지는 받는 중인 사진이 그대로 보였다. 위에서부터 조금씩 그려지거나(회색 띠),
   iOS 는 아직 못 그린 자리에 깨진 그림 아이콘(?)이 1~2프레임 비친 뒤 '툭' 켜졌다(2026-11-05 태진 화면녹화).
   받기 전엔 투명, 받으면 bv-in 으로 떠오르고, 이미 받아 둔 사진(캐시, 뒤로가기)은 bv-now 로 바로 보인다.
   첫 화면 사진 여섯 장은 lazy 를 풀어 바로 받는다(앞 넷은 우선순위 높음). 레이아웃이 끝날 때까지 미루지 않게.
   필터 카드(bv_gender.js card())처럼 나중에 붙는 목록도 같은 규칙. 틀에서 복제돼 따라온 bv-in 은 여기서 지운다.
   이 부분이 돌지 못하면 bv-imgfade 가 붙지 않으므로 사진은 v1 처럼 그냥 보인다. */
if(window.MutationObserver&&d.addEventListener){try{
var Q="ul.prdList .thumbnail a>img:first-of-type",n=0;
var ok=function(m){return m.complete&&m.naturalWidth>0;};
var look=function(m){
if(!m.__bvP){m.__bvP=1;if(n<6&&m.getAttribute("loading")==="lazy"){m.setAttribute("loading","eager");if(n<4)m.setAttribute("fetchpriority","high");}n++;}
if(ok(m))m.classList.add("bv-now","bv-in");else m.classList.remove("bv-in","bv-now");};
var scan=function(x){if(x.nodeType!==1)return;if(x.tagName==="IMG"){if(x.matches(Q))look(x);return;}var a=x.querySelectorAll(Q);for(var i=0;i<a.length;i++)look(a[i]);};
new MutationObserver(function(rs){for(var i=0;i<rs.length;i++){var r=rs[i];if(r.type==="attributes"){if(r.target.tagName==="IMG"&&r.target.matches(Q))look(r.target);}else for(var j=0;j<r.addedNodes.length;j++)scan(r.addedNodes[j]);}}).observe(h,{childList:true,subtree:true,attributes:true,attributeFilter:["src","srcset"]});
d.addEventListener("load",function(e){var m=e.target;if(m&&m.tagName==="IMG"&&ok(m)&&m.matches(Q))m.classList.add("bv-in");},true);
var sweep=function(){var a=d.querySelectorAll(Q);for(var i=0;i<a.length;i++)if(ok(a[i]))a[i].classList.add("bv-in");};
addEventListener("load",sweep);addEventListener("pageshow",sweep);
h.className+=" bv-imgfade";
}catch(e){h.classList.remove("bv-imgfade");}}
})();
</script>
<style>
@keyframes bvSlideUp{from{opacity:0;transform:translateY(110px)}to{opacity:1;transform:none}}
html.bv-slide #contents,html.bv-slide #container:not(:has(#contents)){animation:bvSlideUp .75s cubic-bezier(.16,.84,.34,1) both;will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){html.bv-slide #contents,html.bv-slide #container{animation:none !important}}
ul.prdList{transition:opacity .25s ease}
html.bv-cloak ul.prdList{opacity:0}
html.bv-pcloak #span_product_price_mobile_p_line,html.bv-pcloak #span_product_price_mobile_d_line{display:none !important}
html.bv-pcloak #span_product_price_text{visibility:hidden}
/* [v2] 목록 사진: 받기 전 투명 → bv-in 에서 0.5초 페이드. 상자는 2:3(상품 사진 960×1440)으로 미리 잡아 받기 전후 카드 높이가 같다(모바일 스킨엔 이미 있음, PC 에도 적용) */
ul.prdList .thumbnail a>img:first-of-type{aspect-ratio:auto 2/3}
html.bv-imgfade ul.prdList .thumbnail a>img:first-of-type{opacity:0;transition:opacity .5s ease}
html.bv-imgfade ul.prdList .thumbnail a>img:first-of-type.bv-in{opacity:1}
html.bv-imgfade ul.prdList .thumbnail a>img.bv-now{transition:none}
@media (prefers-reduced-motion:reduce){html.bv-imgfade ul.prdList .thumbnail a>img{transition:none}}
</style>
<!-- /BV-NOFLICKER -->
